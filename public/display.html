<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soap Box Derby Result Display</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/display.css" />
</head>
<body class="display-body">
  <div class="display-shell" id="displayApp">
    <header class="display-header">
      <div class="header-block header-event">
        <div class="label">Event</div>
        <div class="value" id="eventName">SOAP BOX DERBY</div>
      </div>
      <div class="header-block">
        <div class="label">Heat</div>
        <div class="value" id="heatNo">HEAT 1</div>
      </div>
      <div class="header-block status-block">
        <div class="label">Status</div>
        <div class="value status-value" id="statusText">RUNNING</div>
      </div>
      <div class="header-block">
        <div class="label">Last Update</div>
        <div class="value" id="lastUpdate">10:23:14</div>
      </div>
      <div class="header-block">
        <div class="label">Clock</div>
        <div class="value" id="clockText">10:23:22</div>
      </div>
      <div class="header-block best-block">
        <div class="label">Overall Best</div>
        <div class="value best-value" id="overallBest">27.523</div>
      </div>
    </header>

    <main class="display-main">
      <table class="results-table" id="resultsTable">
        <thead>
          <tr>
            <th class="col-pos">Pos</th>
            <th class="col-no">No</th>
            <th class="col-name">Name</th>
            <th class="col-kana">Kana</th>
            <th class="col-car">Car</th>
            <th class="col-practice">Practice</th>
            <th class="col-split split-col">R1-Sec</th>
            <th class="col-goal">R1-Goal</th>
            <th class="col-split split-col">R2-Sec</th>
            <th class="col-goal">R2-Goal</th>
            <th class="col-best">Best</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </main>

    <footer class="display-footer">
      <div class="footer-block now-running">
        <span class="footer-label">Now Running</span>
        <span class="footer-value" id="nowRunning">No.21 TAKEDA RYO</span>
      </div>
      <div class="footer-block next-running">
        <span class="footer-label">Next</span>
        <span class="footer-value" id="nextRunning">No.22 SATO YU</span>
      </div>
      <div class="footer-block connection-block">
        <span class="footer-label">Connection</span>
        <span class="footer-value connection-ok" id="connectionState">CONNECTED</span>
      </div>
    </footer>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/display.js"></script>
</body>
</html>
