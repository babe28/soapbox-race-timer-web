<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Starter Remote</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/starter.css" />
</head>
<body class="starter-body">
  <button type="button" class="starter-fullscreen-btn" id="starterFullscreenBtn" aria-label="全画面切替">全</button>
  <main class="starter-shell">
    <section class="starter-panel">
      <div class="starter-section-label">レースステータス</div>
      <div class="starter-status-grid">
        <button type="button" class="starter-status-btn starter-status-waiting" data-status="waiting">待機中</button>
        <button type="button" class="starter-status-btn starter-status-preparing" data-status="preparing">準備中</button>
        <button type="button" class="starter-status-btn starter-status-running" data-status="running">走行中</button>
        <button type="button" class="starter-status-btn starter-status-finished" data-status="finished">終了</button>
      </div>
    </section>

    <section class="starter-panel">
      <div class="starter-section-label">スタート合図</div>
      <div class="starter-ready-state is-waiting" id="starterReadyState">WAITING</div>
      <div class="starter-slide-shell">
        <div class="starter-slide-control" id="starterReadySlider" data-ready="false" aria-label="スタート準備完了スライダー">
          <div class="starter-slide-track">
            <span class="starter-slide-label starter-slide-label-off">スライドして準備完了</span>
            <span class="starter-slide-label starter-slide-label-on">解除</span>
          </div>
          <div class="starter-slide-thumb" id="starterReadyThumb">
            <span class="starter-slide-thumb-text">▶</span>
          </div>
        </div>
      </div>
      <p class="starter-help">誤操作防止のため、右へスライドすると READY になります。READY 中は左へ戻すと解除できます。</p>
    </section>

    <section class="starter-panel">
      <div class="starter-section-label">キュー</div>
      <div class="starter-queue-card">
        <span>現在走行</span>
        <strong id="starterNowRunning">-</strong>
      </div>
      <div class="starter-queue-card">
        <span>次走</span>
        <strong id="starterNext">-</strong>
      </div>
    </section>
  </main>

  <section class="starter-result-popup" id="starterResultPopup" hidden>
    <div class="starter-result-card">
      <button type="button" class="starter-result-close" id="starterResultCloseBtn" aria-label="閉じる">×</button>
      <div class="starter-result-title">保存完了</div>
      <div class="starter-result-name" id="starterResultName">No.- -</div>
      <div class="starter-result-grid">
        <div class="starter-result-item">
          <span>暫定順位</span>
          <strong id="starterResultRank">-</strong>
        </div>
        <div class="starter-result-item">
          <span>中間タイム</span>
          <strong id="starterResultSplit">-</strong>
        </div>
        <div class="starter-result-item">
          <span>ゴールタイム</span>
          <strong id="starterResultGoal">-</strong>
        </div>
      </div>
    </div>
  </section>

  <script src="/js/starter.js?v=1.0.2" defer></script>
</body>
</html>
