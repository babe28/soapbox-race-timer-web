<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/settings.css" />
</head>
<body class="settings-body">
  <div class="settings-shell">
    <header class="page-header">
      <div>
        <h1>Settings</h1>
        <p class="page-subtitle">表示画面の行数や表示項目を設定します。</p>
      </div>
      <div class="header-actions">
        <a class="ghost-button" href="/entries.html">Entries / Edit</a>
        <a class="ghost-button" href="/control.html">Race Control</a>
        <a class="ghost-button" href="/display.html" target="_blank" rel="noopener noreferrer">Open Display</a>
      </div>
    </header>

    <main class="settings-grid">
      <section class="panel">
        <div class="panel-section">
          <div class="section-title">基本情報</div>
          <form id="settingsForm" class="settings-form">
            <label>
              <span>イベント名</span>
              <input type="text" id="eventName" />
            </label>

            <label>
              <span>クラス名</span>
              <input type="text" id="className" />
            </label>

            <label>
              <span>言語</span>
              <select id="language">
                <option value="ja">ja</option>
                <option value="en">en</option>
              </select>
            </label>

            <label>
              <span>自動バックアップ間隔 (分)</span>
              <input type="number" id="autoBackupIntervalMin" min="1" step="1" />
            </label>

            <div class="section-title sub-section">情報表示画面</div>

            <div class="radio-card-group full-width">
              <span class="field-label">表示行数</span>
              <label class="radio-card"><input type="radio" name="rowsPerPage" value="20" /> <span>20行</span></label>
              <label class="radio-card"><input type="radio" name="rowsPerPage" value="30" /> <span>30行</span></label>
            </div>

            <div class="check-grid full-width">
              <label class="check-card"><input type="checkbox" id="showKana" /> <span>かな表示</span></label>
              <label class="check-card"><input type="checkbox" id="showCarNo" /> <span>車番表示</span></label>
              <label class="check-card"><input type="checkbox" id="showPractice" /> <span>練習タイム表示</span></label>
              <label class="check-card"><input type="checkbox" id="showSplit" /> <span>中間タイム表示</span></label>
              <label class="check-card"><input type="checkbox" id="showClock" /> <span>時計表示</span></label>
              <label class="check-card"><input type="checkbox" id="showLastUpdate" /> <span>更新時刻表示</span></label>
              <label class="check-card"><input type="checkbox" id="showOverallBest" /> <span>全体ベスト表示</span></label>
              <label class="check-card"><input type="checkbox" id="showEffects" /> <span>演出表示</span></label>
            </div>

            <div class="button-row action-row full-width">
              <button type="submit" class="primary">保存</button>
              <button id="reloadSettingsBtn" type="button">再読込</button>
            </div>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="panel-section">
          <div class="section-title">現在の設定</div>
          <div class="current-settings" id="currentSettings"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/settings.js?v=1.0.0" defer></script>
</body>
</html>
