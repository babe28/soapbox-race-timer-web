<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/settings.css" />
</head>
<body class="settings-body">
  <div class="settings-shell">
    <header class="page-header">
      <div>
        <h1>Settings</h1>
        <p class="page-subtitle">Configure display behavior and language.</p>
      </div>
      <div class="header-actions">
        <a class="ghost-button" href="/entries.html">Entries / Edit</a>
        <a class="ghost-button" href="/control.html">Race Control</a>
        <a class="ghost-button" href="/display.html" target="_blank" rel="noopener noreferrer">Open Display</a>
      </div>
    </header>

    <main class="settings-grid">
      <section class="panel">
        <div class="panel-section">
          <div class="section-title">Basic Settings</div>
          <form id="settingsForm" class="settings-form">
            <label>
              <span>Event Name</span>
              <input type="text" id="eventName" />
            </label>

            <label>
              <span>Class Name</span>
              <input type="text" id="className" />
            </label>

            <label>
              <span>Language</span>
              <select id="language">
                <option value="ja">ja</option>
                <option value="en">en</option>
              </select>
            </label>

            <label>
              <span>Auto Backup Interval (min)</span>
              <input type="number" id="autoBackupIntervalMin" min="1" step="1" />
            </label>

            <div class="section-title sub-section">Display Settings</div>

            <div class="radio-card-group full-width">
              <span class="field-label">Rows Per Page</span>
              <label class="radio-card"><input type="radio" name="rowsPerPage" value="20" /> <span>20 rows</span></label>
              <label class="radio-card"><input type="radio" name="rowsPerPage" value="30" /> <span>30 rows</span></label>
            </div>

            <div class="check-grid full-width">
              <label class="check-card"><input type="checkbox" id="showKana" /> <span>Show Kana</span></label>
              <label class="check-card"><input type="checkbox" id="showCarNo" /> <span>Show Car No</span></label>
              <label class="check-card"><input type="checkbox" id="showPractice" /> <span>Show Practice</span></label>
              <label class="check-card"><input type="checkbox" id="showMemo" /> <span>Show Memo</span></label>
              <label class="check-card"><input type="checkbox" id="showSplit" /> <span>Show Split</span></label>
              <label class="check-card"><input type="checkbox" id="showClock" /> <span>Show Clock</span></label>
              <label class="check-card"><input type="checkbox" id="showLastUpdate" /> <span>Show Last Update</span></label>
              <label class="check-card"><input type="checkbox" id="showOverallBest" /> <span>Show Overall Best</span></label>
              <label class="check-card"><input type="checkbox" id="overallBestIncludePractice" /> <span>Overall Best Includes Practice</span></label>
              <label class="check-card"><input type="checkbox" id="showEffects" /> <span>Show Effects</span></label>
            </div>

            <label class="full-width">
              <span>Memo Column Title</span>
              <input type="text" id="memoTitle" placeholder="Memo" />
            </label>

            <div class="button-row action-row full-width">
              <button type="submit" class="primary">Save</button>
              <button id="reloadSettingsBtn" type="button">Reload</button>
              <button id="resetDbBtn" type="button" class="danger-button">Initialize Database</button>
            </div>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="panel-section">
          <div class="section-title">Current Settings</div>
          <div class="current-settings" id="currentSettings"></div>
        </div>
        <div class="panel-section">
          <div class="section-title">Tools</div>
          <div class="button-grid">
            <button id="exportCsvBtn" type="button" class="primary">Export CSV</button>
            <button id="reloadLogsBtn" type="button">Reload Logs</button>
            <button id="reloadApisBtn" type="button">Reload API List</button>
          </div>
        </div>
        <div class="panel-section">
          <div class="section-title">Audit Logs</div>
          <div class="log-list" id="auditLogs">
            <div class="log-row"><span>Loading...</span></div>
          </div>
        </div>
        <div class="panel-section">
          <div class="section-title">API Catalog</div>
          <div class="api-list" id="apiCatalog">
            <div class="api-row"><span>Loading...</span></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/settings.js?v=1.0.0" defer></script>
</body>
</html>
