<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entries / Edit</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/entries.css" />
</head>
<body class="entries-body">
  <div class="entries-shell">
    <header class="page-header">
      <div>
        <h1>Entries / Edit</h1>
        <p class="page-subtitle">Manage entries, display order, and heat selection from one screen.</p>
      </div>
      <div class="header-actions">
        <a class="ghost-button" href="/control.html">Race Control</a>
        <a class="ghost-button" href="/display.html" target="_blank" rel="noopener noreferrer">Open Display</a>
        <a class="ghost-button" href="/settings.html">Settings</a>
      </div>
    </header>

    <main class="entries-grid">
      <section class="panel">
        <div class="panel-section">
          <div class="section-title">Heat Management</div>
          <div class="entry-form heat-form">
            <label class="full-width">
              <span>Current Heat</span>
              <select id="currentHeatId"></select>
            </label>

            <label>
              <span>Heat Code *</span>
              <input type="text" id="heatCode" maxlength="2" placeholder="A1" />
            </label>

            <label>
              <span>Heat Title</span>
              <input type="text" id="heatTitle" placeholder="Optional" />
            </label>

            <div class="button-row action-row full-width">
              <button id="selectHeatBtn" type="button">Select Heat</button>
              <button id="saveHeatBtn" class="primary" type="button">Add Heat</button>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <div class="section-title">Entry Form</div>
          <form id="entryForm" class="entry-form">
            <input type="hidden" id="entryId" />

            <label>
              <span>Bib No *</span>
              <input type="number" id="bibNo" min="1" step="1" required />
            </label>

            <label>
              <span>Name *</span>
              <input type="text" id="name" required />
            </label>

            <label>
              <span>Kana</span>
              <input type="text" id="kana" />
            </label>

            <label>
              <span>Car No</span>
              <input type="text" id="carNo" />
            </label>

            <label>
              <span>Start Order *</span>
              <input type="number" id="startOrder" min="1" step="1" required />
            </label>

            <label>
              <span>Display Order</span>
              <input type="number" id="effectiveOrder" min="1" step="1" />
            </label>

            <label class="full-width">
              <span>Memo</span>
              <input type="text" id="memo" />
            </label>

            <div class="button-row action-row full-width">
              <button id="saveEntryBtn" class="primary" type="submit">Save</button>
              <button id="resetEntryBtn" type="button">Reset</button>
            </div>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="panel-section">
          <div class="toolbar">
            <div class="toolbar-left">
              <div class="section-title no-margin">Entries</div>
              <input type="search" id="searchInput" placeholder="Search by bib, name, kana, or car no" />
            </div>
            <div class="toolbar-right">
              <button id="refreshBtn" type="button">Reload</button>
              <button id="normalizeBtn" type="button">Normalize Order</button>
            </div>
          </div>

          <div class="summary-strip" id="summaryStrip">
            <div class="summary-box"><span>Total</span><strong id="sumTotal">0</strong></div>
            <div class="summary-box"><span>Active</span><strong id="sumActive">0</strong></div>
            <div class="summary-box"><span>Skipped</span><strong id="sumSkipped">0</strong></div>
          </div>

          <div class="table-wrap">
            <table class="entries-table">
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Bib</th>
                  <th>Name</th>
                  <th>Kana</th>
                  <th>Car</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="entriesBody">
                <tr>
                  <td colspan="7" class="empty-cell">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/entries.js?v=1.0.0" defer></script>
</body>
</html>
